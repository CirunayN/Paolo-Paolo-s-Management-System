<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#tkBg)"/>
  <!-- Trunk Tray Outline -->
  <path d="M 60 90 L 340 90 L 320 225 L 80 225 Z" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))"/>
  <path d="M 75 105 L 325 105 L 308 212 L 92 212 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <!-- Ridges for spill containment -->
  <g stroke="#334155" stroke-width="3">
    <line x1="120" y1="125" x2="120" y2="195"/>
    <line x1="160" y1="125" x2="160" y2="195"/>
    <line x1="200" y1="125" x2="200" y2="195"/>
    <line x1="240" y1="125" x2="240" y2="195"/>
    <line x1="280" y1="125" x2="280" y2="195"/>
  </g>
  <text x="200" y="165" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CARGO TRUNK LINER</text>
  <!-- Badge -->
  <rect x="15" y="15" width="150" height="26" rx="13" fill="#0284c7" opacity="0.95"/>
  <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRUNK CARGO TRAY</text>
</svg>
