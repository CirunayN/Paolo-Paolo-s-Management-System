<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <pattern id="diamondPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 12 L 12 24 L 0 12 Z" fill="#18181b" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="1.5" fill="#f87171"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#dmBg)"/>
  <!-- Mat Base -->
  <path d="M 85 70 Q 200 55 315 70 L 335 230 Q 200 245 65 230 Z" fill="#121214" stroke="#dc2626" stroke-width="3.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.7))"/>
  <!-- Diamond Stitched Pattern Fill -->
  <path d="M 95 80 Q 200 68 305 80 L 322 220 Q 200 232 78 220 Z" fill="url(#diamondPattern)"/>
  <!-- Detachable Coil Insert Plate -->
  <rect x="130" y="115" width="140" height="75" rx="8" fill="#1c1917" stroke="#e11d48" stroke-width="2"/>
  <!-- Gold / Red Stitch Accent -->
  <text x="200" y="150" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5D DIAMOND LUXURY</text>
  <text x="200" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Leatherette + Anti-Scratch</text>
  <!-- Badge -->
  <rect x="15" y="15" width="145" height="26" rx="13" fill="#dc2626" opacity="0.95"/>
  <text x="87" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5D DIAMOND LEATHER</text>
</svg>
