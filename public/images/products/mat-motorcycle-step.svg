<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#mcBg)"/>
  <!-- Left & Right Stepboard Footpads -->
  <!-- Left Side -->
  <g filter="drop-shadow(0 8px 12px rgba(0,0,0,0.6))">
    <path d="M 60 80 L 150 90 L 130 220 L 70 200 Z" rx="10" fill="#27272a" stroke="#eab308" stroke-width="2.5"/>
    <!-- Anti-slip studs -->
    <g fill="#eab308">
      <circle cx="85" cy="115" r="4"/><circle cx="115" cy="120" r="4"/>
      <circle cx="85" cy="145" r="4"/><circle cx="115" cy="150" r="4"/>
      <circle cx="85" cy="175" r="4"/><circle cx="110" cy="180" r="4"/>
    </g>
  </g>
  <!-- Right Side -->
  <g filter="drop-shadow(0 8px 12px rgba(0,0,0,0.6))">
    <path d="M 250 90 L 340 80 L 330 200 L 270 220 Z" rx="10" fill="#27272a" stroke="#eab308" stroke-width="2.5"/>
    <g fill="#eab308">
      <circle cx="285" cy="120" r="4"/><circle cx="315" cy="115" r="4"/>
      <circle cx="285" cy="150" r="4"/><circle cx="315" cy="145" r="4"/>
      <circle cx="290" cy="180" r="4"/><circle cx="315" cy="175" r="4"/>
    </g>
  </g>
  <!-- Center Plate -->
  <rect x="170" y="125" width="60" height="60" rx="8" fill="#18181b" stroke="#eab308" stroke-width="1.5"/>
  <text x="200" y="160" fill="#eab308" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MOTO</text>
  <!-- Badge -->
  <rect x="15" y="15" width="165" height="26" rx="13" fill="#ca8a04" opacity="0.95"/>
  <text x="97" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MOTORCYCLE FOOTBOARD</text>
</svg>
