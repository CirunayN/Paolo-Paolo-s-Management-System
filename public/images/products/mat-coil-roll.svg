<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="coilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#coilBg)"/>
  <!-- Rolled Mat Cylinder -->
  <g filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))">
    <!-- Cylinder Body -->
    <rect x="90" y="80" width="180" height="150" rx="4" fill="url(#rollGrad)" stroke="#4ade80" stroke-width="2"/>
    <!-- Unrolled section extending to the right -->
    <path d="M 270 140 L 340 160 L 330 225 L 270 210 Z" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <!-- Cylinder Top Ellipse -->
    <ellipse cx="90" cy="155" rx="30" ry="75" fill="#166534" stroke="#86efac" stroke-width="3"/>
    <ellipse cx="90" cy="155" rx="12" ry="30" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  </g>
  <!-- Noodle / Coil Texture Lines -->
  <g stroke="#bbf7d0" stroke-width="1.5" opacity="0.6">
    <path d="M 130 95 Q 140 105 130 115 Q 120 125 130 135"/>
    <path d="M 170 95 Q 180 105 170 115 Q 160 125 170 135"/>
    <path d="M 210 95 Q 220 105 210 115 Q 200 125 210 135"/>
    <path d="M 150 160 Q 160 170 150 180 Q 140 190 150 200"/>
    <path d="M 190 160 Q 200 170 190 180 Q 180 190 190 200"/>
    <path d="M 230 160 Q 240 170 230 180 Q 220 190 230 200"/>
  </g>
  <!-- Badge -->
  <rect x="15" y="15" width="155" height="26" rx="13" fill="#16a34a" opacity="0.95"/>
  <text x="92" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COIL MAT ROLL (1.2x9M)</text>
</svg>
