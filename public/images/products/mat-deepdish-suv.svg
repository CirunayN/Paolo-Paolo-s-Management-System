<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="suvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#suvBg)"/>
  <!-- Floor Grid Pattern -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
  </g>
  <!-- Deep Dish Mat Body -->
  <path d="M 80 80 Q 200 60 320 80 L 345 220 Q 200 240 55 220 Z" fill="url(#matGrad)" stroke="url(#edgeGlow)" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))"/>
  <!-- Raised Deep Dish Lip -->
  <path d="M 95 95 Q 200 78 305 95 L 325 208 Q 200 225 75 208 Z" fill="#111827" stroke="#475569" stroke-width="2"/>
  <!-- TPE Texture / Ridges -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="115" x2="280" y2="115"/>
    <line x1="115" y1="135" x2="285" y2="135"/>
    <line x1="110" y1="155" x2="290" y2="155"/>
    <line x1="115" y1="175" x2="285" y2="175"/>
    <line x1="125" y1="195" x2="275" y2="195"/>
  </g>
  <!-- Heel Pad -->
  <rect x="140" y="125" width="120" height="55" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Anti-slip grooves -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <line x1="150" y1="140" x2="250" y2="140"/>
    <line x1="150" y1="152" x2="250" y2="152"/>
    <line x1="150" y1="165" x2="250" y2="165"/>
  </g>
  <!-- Badge Label -->
  <rect x="15" y="15" width="135" height="26" rx="13" fill="#0284c7" opacity="0.9"/>
  <text x="82" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SUV 3-ROW TPE</text>
  <!-- Retention Clip -->
  <circle cx="200" cy="205" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="200" cy="205" r="3" fill="#38bdf8"/>
</svg>
