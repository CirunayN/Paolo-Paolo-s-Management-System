<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ckBg)"/>
  <!-- Spray Bottle -->
  <g filter="drop-shadow(0 8px 12px rgba(0,0,0,0.6))">
    <rect x="120" y="110" width="55" height="110" rx="10" fill="#0d9488" stroke="#2dd4bf" stroke-width="2"/>
    <!-- Bottle Neck -->
    <rect x="135" y="85" width="25" height="25" fill="#14b8a6"/>
    <!-- Trigger Spray -->
    <path d="M 130 85 L 120 70 L 165 70 L 175 85 Z" fill="#0f766e"/>
    <path d="M 115 75 L 105 75" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Folded Microfiber Towel -->
  <g filter="drop-shadow(0 8px 12px rgba(0,0,0,0.6))">
    <path d="M 195 140 L 275 140 L 290 220 L 210 220 Z" rx="8" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
    <path d="M 215 155 L 285 155 L 298 220 L 228 220 Z" rx="8" fill="#0891b2"/>
  </g>
  <!-- Detail Brush -->
  <rect x="295" y="100" width="14" height="115" rx="5" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="290" y="85" width="24" height="20" rx="3" fill="#334155"/>
  <!-- Badge -->
  <rect x="15" y="15" width="150" height="26" rx="13" fill="#0d9488" opacity="0.95"/>
  <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DETAILING CARE KIT</text>
</svg>
