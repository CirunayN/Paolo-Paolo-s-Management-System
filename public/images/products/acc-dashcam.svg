<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#dcBg)"/>
  <!-- Dashcam Body -->
  <g filter="drop-shadow(0 10px 18px rgba(0,0,0,0.7))">
    <rect x="110" y="85" width="180" height="120" rx="14" fill="#27272a" stroke="#a855f7" stroke-width="2.5"/>
    <!-- Screen / Lens -->
    <circle cx="200" cy="145" r="42" fill="#09090b" stroke="#7e22ce" stroke-width="3"/>
    <circle cx="200" cy="145" r="28" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="200" cy="145" r="14" fill="#0369a1"/>
    <circle cx="195" cy="140" r="5" fill="#ffffff" opacity="0.8"/>
    <!-- Mount -->
    <rect x="185" y="60" width="30" height="25" rx="3" fill="#3f3f46"/>
    <ellipse cx="200" cy="60" rx="25" ry="8" fill="#52525b"/>
  </g>
  <!-- Mini Rear Cam -->
  <rect x="295" y="150" width="50" height="40" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="320" cy="170" r="10" fill="#09090b" stroke="#38bdf8" stroke-width="1"/>
  <text x="320" y="195" fill="#a855f7" font-family="sans-serif" font-size="8" text-anchor="middle">REAR</text>
  <!-- Badge -->
  <rect x="15" y="15" width="145" height="26" rx="13" fill="#9333ea" opacity="0.95"/>
  <text x="87" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4K DUAL DASHCAM</text>
</svg>
