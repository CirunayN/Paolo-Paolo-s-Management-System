<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Shield Emblem -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))">
    <path d="M 15 15 L 55 15 L 55 45 C 55 60 35 70 35 70 C 35 70 15 60 15 45 Z" fill="url(#logoGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Double P monogram -->
    <text x="27" y="44" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900">P</text>
    <text x="36" y="52" fill="#0f172a" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900">P</text>
  </g>
  <!-- Main Title -->
  <text x="70" y="36" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="1">PAOLO PAOLO</text>
  <!-- Subtitle -->
  <rect x="70" y="46" width="235" height="18" rx="4" fill="#0369a1"/>
  <text x="187" y="59" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">D.A MATTING &amp; ACCESSORIES</text>
</svg>
